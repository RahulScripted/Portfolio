    <!-- SVG filter for rough/stamp effect -->
    <svg id="rg-filter" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="rough-stamp" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="turbulence" baseFrequency="0.04 0.07" numOctaves="2" seed="5" result="t"/>
          <feDisplacementMap in="SourceGraphic" in2="t" scale="6" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>
